  <!-- 👇 FACEBOOK PIXEL 👇 -->
  <script>
    (function () {
      // Берём pixel из URL (?pixel=123456789 или ?pixel=123,456)
      var url = new URL(window.location.href);
      var raw = (url.searchParams.get('pixel') || '').trim();

      // Поддержка нескольких ID через запятую
      var ids = raw
        .split(',')
        .map(function (s) { return (s || '').trim(); })
        .filter(function (s) { return /^\d{5,20}$/.test(s); });

      // Если параметр отсутствует — не инициализируем fbq
      if (!ids.length) return;

      // Bootstrap Meta Pixel
      (function (f, b, e, v, n, t, s) {
        if (f.fbq) return; n = f.fbq = function () {
          n.callMethod ?
          n.callMethod.apply(n, arguments) : n.queue.push(arguments)
        };
        if (!f._fbq) f._fbq = n; n.push = n; n.loaded = !0; n.version = '2.0';
        n.queue = []; t = b.createElement(e); t.async = !0; t.src = v;
        s = b.getElementsByTagName(e)[0]; s.parentNode.insertBefore(t, s);
      })(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js');

      // Инициализация каждого найденного pixel ID
      ids.forEach(function (id) {
        try { fbq('init', id); console.log('✅ FB Pixel initialized:', id); }
        catch (e) { console.warn('fbq init error:', e); }
      });

      // Отправляем PageView
      try { fbq('track', 'PageView'); } catch (e) { }

      // Сохраняем ID в глобальную переменную
      window.fbPixelIds = ids;
    })();
  </script>
</head>

  <script>

  <script>window.CONFIG_URL = './config.json';</script>
  <script>
    // --- PREBOOT SAFETY SHIM ---
    // Мінімум, щоб нічого не впало до config:ready
    (function () {
      // завжди один об’єкт і одна «точка правди»
      window.AppConfig = window.AppConfig || {};
      window.ThemeConfig = window.ThemeConfig || window.AppConfig;

      // гарантуємо наявність критичних вузлів
      if (!window.AppConfig.product || typeof window.AppConfig.product !== 'object') {
        window.AppConfig.product = { name: '' };
      }
      if (!window.AppConfig.brand || typeof window.AppConfig.brand !== 'object') {
        window.AppConfig.brand = { name: '' };
      }
      if (!window.AppConfig.header || typeof window.AppConfig.header !== 'object') {
        window.AppConfig.header = {};
      }
      if (!window.AppConfig.page_title) {
        window.AppConfig.page_title = document.title || '';
      }

      // деякі модулі можуть викликати це
      if (typeof window.getLang !== 'function') {
        window.getLang = function () { return window.langKey || 'en'; };
      }

      // коли приїде справжній конфіг — підміняємо атомарно
      window.addEventListener('config:ready', function (e) {
        var cfg = (e && e.detail && e.detail.ThemeConfig) || window.ThemeConfig || {};
        // safety на випадок кривих локалей
        if (!cfg.product) cfg.product = { name: '' };
        if (!cfg.brand) cfg.brand = { name: '' };
        window.ThemeConfig = cfg;
        window.AppConfig = cfg;
      }, { once: true });
    })();
  </script>
  <script src="js/configuration.js"></script>
  <script>
    // 🔒 Страхувальна подушка, якщо модулі стартують раніше:
    (function () {
      // Мінімум, щоб HeaderManager не впав
      window.AppConfig = window.AppConfig || {};
      window.ThemeConfig = window.ThemeConfig || window.AppConfig;
      if (!window.AppConfig.product) window.AppConfig.product = { name: '' };

      // Коли готовий реальний конфіг — підміняємо
      window.addEventListener('config:ready', function (e) {
        var cfg = (e && e.detail && e.detail.ThemeConfig) || window.ThemeConfig || {};
        if (!cfg.product) cfg.product = { name: '' };       // safety
        window.ThemeConfig = cfg;
        window.AppConfig = cfg;
      }, { once: true });
    })();
  </script>

  <!-- Патч: собираем данные из PrefillManager и подставляем -->
  <script>
    (function () {
      function getOfferBase() {
        var a = document.getElementById('redirect-url');
        var href = a && a.getAttribute('href');
        if (href && !/\{offer(_link)?\}/i.test(href)) return href;
        var qs = new URLSearchParams(location.search);
        return qs.get('offer_link') || qs.get('offer') || null;
      }

      function collectFormData() {
        var data = {};

        if (window.prefillManager && typeof window.prefillManager.getPrefillData === "function") {
          var pf = window.prefillManager.getPrefillData() || {};
          // правильный маппинг
          if (pf.firstname) data.first = pf.firstname;
          if (pf.lastname) data.last = pf.lastname;
          if (pf.postcode) data.zip = pf.postcode;
          if (pf.city) data.city = pf.city;
          if (pf.address) data.address = pf.address;
          if (pf.email) data.email = pf.email;
          if (pf.phone) data.phone = pf.phone;
        }

        return data;
      }

      function buildOfferUrl(base) {
        if (!base) return null;
        var url;
        try { url = new URL(base); } catch { return base; }

        var params = collectFormData();
        for (var key in params) {
          if (params[key]) url.searchParams.set(key, params[key]);
        }
        return url.toString();
      }

      function applyOfferToAnchors(base) {
        if (!base) return;
        var url = buildOfferUrl(base);
        if (!url) return;
        document.querySelectorAll('a[href="{offer_link}"], a[href="{offer}"]').forEach(function (el) {
          el.setAttribute('href', url);
        });
      }

      function patchRedirectManager(base) {
        if (!window.RedirectManager) return;
        var proto = window.RedirectManager.prototype;
        var orig = proto.redirect;
        proto.redirect = function () {
          var url = buildOfferUrl(base || getOfferBase());
          if (url) {
            window.location.replace(decodeURIComponent(url));
            return;
          }
          try { return orig.apply(this, arguments); } catch (e) { }
        };
      }
      // Read offer override from DOM/link or global var
      function readOfferOverride() {
        try {
          // 1) URL param ?offer=...
          var qOffer = new URLSearchParams(window.location.search).get("offer");
          if (qOffer && qOffer !== "{offer_link}") return qOffer.trim();

          // 2) Hidden anchor
          var a = document.getElementById("redirect-url");
          var domHref = (a && (a.getAttribute("href") || a.dataset.redirectUrl || "") || "").trim();
          if (domHref && domHref !== "{offer_link}") return domHref;

          // 3) Global override (optional)
          if (typeof window.OFFER_URL === "string" && window.OFFER_URL.trim()) {
            return window.OFFER_URL.trim();
          }
        } catch (e) { }
        return "";
      }
      function init() {
        var base = getOfferBase();
        applyOfferToAnchors(base);
        patchRedirectManager(base);
        readOfferOverride();
      }

      if (document.readyState !== 'loading') init();
      else document.addEventListener('DOMContentLoaded', init);
    })();
  </script>
